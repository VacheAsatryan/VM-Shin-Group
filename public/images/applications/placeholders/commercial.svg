<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#FFD45A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Modern Commercial Glass Office Tower Silhouette -->
  <g transform="translate(220, 80)">
    <!-- Tower Main Mass -->
    <path d="M 60 380 L 60 40 L 260 40 L 260 380 Z" fill="rgba(245,184,0,0.03)" stroke="url(#gold-accent)" stroke-width="3"/>
    <!-- Glass Facade Curtain Wall Grid -->
    <line x1="110" y1="40" x2="110" y2="380" stroke="rgba(245,184,0,0.3)" stroke-width="1.5"/>
    <line x1="160" y1="40" x2="160" y2="380" stroke="rgba(245,184,0,0.3)" stroke-width="1.5"/>
    <line x1="210" y1="40" x2="210" y2="380" stroke="rgba(245,184,0,0.3)" stroke-width="1.5"/>

    <line x1="60" y1="100" x2="260" y2="100" stroke="rgba(245,184,0,0.2)" stroke-width="1"/>
    <line x1="60" y1="160" x2="260" y2="160" stroke="rgba(245,184,0,0.2)" stroke-width="1"/>
    <line x1="60" y1="220" x2="260" y2="220" stroke="rgba(245,184,0,0.2)" stroke-width="1"/>
    <line x1="60" y1="280" x2="260" y2="280" stroke="rgba(245,184,0,0.2)" stroke-width="1"/>
    <line x1="60" y1="340" x2="260" y2="340" stroke="rgba(245,184,0,0.2)" stroke-width="1"/>

    <!-- Entrance Canopy -->
    <path d="M 30 380 L 290 380" stroke="#F5B800" stroke-width="4"/>
  </g>

  <!-- Technical Marks -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 60 L 760 40 L 740 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 40 540 L 40 560 L 60 560" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 540 L 760 560 L 740 560" fill="none" stroke="#F5B800" stroke-width="2"/>

  <text x="100" y="535" fill="#F5B800" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CATEGORY 06 // COMMERCIAL SPACES &amp; BUSINESS CENTERS</text>
  <text x="100" y="555" fill="#a3a3a3" font-family="sans-serif" font-size="11">VM SHIN GROUP • RETAIL, BUSINESS PARKS &amp; PLAZA INFRASTRUCTURE</text>
</svg>
