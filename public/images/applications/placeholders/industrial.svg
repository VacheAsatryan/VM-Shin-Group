<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#FFD45A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Industrial Warehouse / Plant Art -->
  <g transform="translate(160, 150)">
    <!-- Sawtooth Roof Warehouse -->
    <path d="M 40 220 L 40 120 L 120 60 L 120 120 L 200 60 L 200 120 L 280 60 L 280 120 L 440 120 L 440 220 Z" fill="rgba(245,184,0,0.03)" stroke="url(#gold-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Heavy Duty Crane / Chimney Silhouette -->
    <path d="M 360 120 L 360 30 L 390 30 L 390 120 Z" fill="none" stroke="#F5B800" stroke-width="2"/>
    <!-- Loading Bay Doors -->
    <rect x="80" y="150" width="70" height="70" fill="rgba(245,184,0,0.08)" stroke="#F5B800" stroke-width="2"/>
    <rect x="180" y="150" width="70" height="70" fill="rgba(245,184,0,0.08)" stroke="#F5B800" stroke-width="2"/>
    <!-- Structural Truss Hatching -->
    <line x1="120" y1="60" x2="200" y2="120" stroke="rgba(245,184,0,0.3)" stroke-width="1.5"/>
    <line x1="200" y1="60" x2="280" y2="120" stroke="rgba(245,184,0,0.3)" stroke-width="1.5"/>
  </g>

  <!-- Technical Marks -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 60 L 760 40 L 740 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 40 540 L 40 560 L 60 560" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 540 L 760 560 L 740 560" fill="none" stroke="#F5B800" stroke-width="2"/>

  <text x="100" y="535" fill="#F5B800" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CATEGORY 02 // INDUSTRIAL FACILITIES</text>
  <text x="100" y="555" fill="#a3a3a3" font-family="sans-serif" font-size="11">VM SHIN GROUP • HEAVY INDUSTRIAL CONCRETE &amp; WAREHOUSE FLOORS</text>
</svg>
