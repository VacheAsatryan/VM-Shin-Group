<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#FFD45A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Public / Municipal Building Portico & Columns Art -->
  <g transform="translate(180, 140)">
    <!-- Triangular Pediment -->
    <path d="M 40 100 L 220 30 L 400 100 Z" fill="rgba(245,184,0,0.05)" stroke="url(#gold-accent)" stroke-width="3" stroke-linejoin="round"/>
    <rect x="40" y="100" width="360" height="20" fill="rgba(245,184,0,0.1)" stroke="#F5B800" stroke-width="2"/>
    <!-- Classical Architectural Columns -->
    <rect x="70" y="120" width="30" height="150" fill="none" stroke="url(#gold-accent)" stroke-width="2"/>
    <rect x="150" y="120" width="30" height="150" fill="none" stroke="url(#gold-accent)" stroke-width="2"/>
    <rect x="260" y="120" width="30" height="150" fill="none" stroke="url(#gold-accent)" stroke-width="2"/>
    <rect x="340" y="120" width="30" height="150" fill="none" stroke="url(#gold-accent)" stroke-width="2"/>
    <!-- Base Stairs -->
    <rect x="40" y="270" width="360" height="15" fill="rgba(245,184,0,0.08)" stroke="#F5B800" stroke-width="1.5"/>
    <rect x="20" y="285" width="400" height="15" fill="rgba(245,184,0,0.08)" stroke="#F5B800" stroke-width="1.5"/>
  </g>

  <!-- Technical Marks -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 60 L 760 40 L 740 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 40 540 L 40 560 L 60 560" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 540 L 760 560 L 740 560" fill="none" stroke="#F5B800" stroke-width="2"/>

  <text x="100" y="535" fill="#F5B800" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CATEGORY 05 // PUBLIC &amp; MUNICIPAL BUILDINGS</text>
  <text x="100" y="555" fill="#a3a3a3" font-family="sans-serif" font-size="11">VM SHIN GROUP • EDUCATIONAL, MEDICAL &amp; CIVIC STRUCTURES</text>
</svg>
