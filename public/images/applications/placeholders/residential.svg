<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#FFD45A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Architectural Frame & Grid lines -->
  <line x1="80" y1="0" x2="80" y2="600" stroke="rgba(245,184,0,0.1)" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="600" stroke="rgba(245,184,0,0.1)" stroke-width="1"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="rgba(245,184,0,0.1)" stroke-width="1"/>

  <!-- Residential Building Line Art -->
  <g transform="translate(200, 140)">
    <!-- Main House Structure -->
    <path d="M 50 240 L 50 140 L 200 40 L 350 140 L 350 240 Z" fill="none" stroke="url(#gold-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Extension Structure -->
    <path d="M 350 240 L 350 160 L 450 160 L 450 240 Z" fill="none" stroke="#F5B800" stroke-opacity="0.5" stroke-width="2"/>
    <!-- Windows Grid -->
    <rect x="100" y="150" width="50" height="50" fill="rgba(245,184,0,0.05)" stroke="#F5B800" stroke-width="2"/>
    <rect x="250" y="150" width="50" height="50" fill="rgba(245,184,0,0.05)" stroke="#F5B800" stroke-width="2"/>
    <!-- Door -->
    <rect x="180" y="170" width="40" height="70" fill="rgba(245,184,0,0.1)" stroke="url(#gold-accent)" stroke-width="2"/>
    <!-- Technical Blueprint Measurement lines -->
    <line x1="30" y1="40" x2="30" y2="240" stroke="#a3a3a3" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="20" y1="40" x2="40" y2="40" stroke="#a3a3a3" stroke-width="1"/>
    <line x1="20" y1="240" x2="40" y2="240" stroke="#a3a3a3" stroke-width="1"/>
    <text x="15" y="145" fill="#a3a3a3" font-family="monospace" font-size="10" transform="rotate(-90 15,145)">H: 12.5m</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 60 L 760 40 L 740 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 40 540 L 40 560 L 60 560" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 540 L 760 560 L 740 560" fill="none" stroke="#F5B800" stroke-width="2"/>

  <!-- Technical Labels -->
  <text x="100" y="535" fill="#F5B800" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CATEGORY 01 // RESIDENTIAL CONSTRUCTION</text>
  <text x="100" y="555" fill="#a3a3a3" font-family="sans-serif" font-size="11">VM SHIN GROUP • CONCRETE &amp; PUMICE BLOCK APPLICATION</text>
</svg>
