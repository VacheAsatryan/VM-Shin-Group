<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B800"/>
      <stop offset="100%" stop-color="#FFD45A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg-grad)"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Road & Sidewalk Curbstone Perspective -->
  <g transform="translate(150, 100)">
    <!-- Perspective Highway Line -->
    <path d="M 50 350 L 220 80 L 280 80 L 450 350 Z" fill="rgba(245,184,0,0.03)" stroke="url(#gold-accent)" stroke-width="3"/>
    <!-- Center Dividing Dashed Line -->
    <line x1="250" y1="80" x2="250" y2="350" stroke="#F5B800" stroke-width="3" stroke-dasharray="20,15"/>
    <!-- Curbstone Heavy Border Left -->
    <path d="M 10 350 L 200 80" stroke="#F5B800" stroke-width="4" stroke-opacity="0.6"/>
    <!-- Curbstone Heavy Border Right -->
    <path d="M 490 350 L 300 80" stroke="#F5B800" stroke-width="4" stroke-opacity="0.6"/>
    <!-- Paving Pattern Sidewalk Grid Left -->
    <line x1="0" y1="280" x2="150" y2="280" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <line x1="0" y1="200" x2="180" y2="200" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </g>

  <!-- Technical Marks -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 60 L 760 40 L 740 40" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 40 540 L 40 560 L 60 560" fill="none" stroke="#F5B800" stroke-width="2"/>
  <path d="M 760 540 L 760 560 L 740 560" fill="none" stroke="#F5B800" stroke-width="2"/>

  <text x="100" y="535" fill="#F5B800" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CATEGORY 03 // ROAD CONSTRUCTION &amp; INFRASTRUCTURE</text>
  <text x="100" y="555" fill="#a3a3a3" font-family="sans-serif" font-size="11">VM SHIN GROUP • CURBSTONES, PAVEMENT &amp; HIGHWAY CONCRETE</text>
</svg>
