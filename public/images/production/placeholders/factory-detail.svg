<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616" />
      <stop offset="50%" stop-color="#101010" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B800" />
      <stop offset="100%" stop-color="#FFD45A" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)" />
  
  <!-- Quality Control Conveyor Inspection Line Graphic -->
  <g transform="translate(100, 80)">
    <!-- Heavy Conveyor Rollers -->
    <rect x="40" y="180" width="320" height="40" rx="8" fill="#202020" stroke="#F5B800" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="80" cy="200" r="14" fill="#333" stroke="#F5B800" stroke-width="1.5" />
    <circle cx="160" cy="200" r="14" fill="#333" stroke="#F5B800" stroke-width="1.5" />
    <circle cx="240" cy="200" r="14" fill="#333" stroke="#F5B800" stroke-width="1.5" />
    <circle cx="320" cy="200" r="14" fill="#333" stroke="#F5B800" stroke-width="1.5" />
    
    <!-- Inspected Concrete Blocks on Line -->
    <polygon points="60,140 130,110 170,140 100,170" fill="#2E2E2E" stroke="#F5B800" stroke-width="2" />
    <polygon points="60,140 100,170 100,190 60,160" fill="#1A1A1A" stroke="#F5B800" stroke-width="1.5" />
    <polygon points="100,170 170,140 170,160 100,190" fill="#151515" stroke="#F5B800" stroke-width="1.5" />
    
    <polygon points="200,140 270,110 310,140 240,170" fill="#2E2E2E" stroke="url(#gold)" stroke-width="2" />
    <polygon points="200,140 240,170 240,190 200,160" fill="#1A1A1A" stroke="#F5B800" stroke-width="1.5" />
    <polygon points="240,170 310,140 310,160 240,190" fill="#151515" stroke="#F5B800" stroke-width="1.5" />
  </g>
  
  <!-- Technical Overlay Badge -->
  <rect x="30" y="30" width="220" height="30" rx="5" fill="rgba(245, 184, 0, 0.12)" stroke="#F5B800" stroke-opacity="0.4" />
  <text x="140" y="50" fill="#FFD45A" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="2" text-anchor="middle">QUALITY CONTROL LINE</text>
</svg>
