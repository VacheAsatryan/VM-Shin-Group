<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0E0E0E" />
      <stop offset="100%" stop-color="#060606" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B800" />
      <stop offset="100%" stop-color="#FFD45A" />
    </linearGradient>
  </defs>
  <rect width="1000" height="650" fill="url(#bg)" />
  
  <!-- Architectural Production Grid Lines -->
  <g opacity="0.08" stroke="#F5B800" stroke-width="1">
    <path d="M 0 130 H 1000 M 0 260 H 1000 M 0 390 H 1000 M 0 520 H 1000" />
    <path d="M 125 0 V 650 M 250 0 V 650 M 375 0 V 650 M 500 0 V 650 M 625 0 V 650 M 750 0 V 650 M 875 0 V 650" />
  </g>
  
  <!-- Concrete Factory Silos & Automated Batching Plant Graphic -->
  <g transform="translate(180, 100)">
    <!-- Silo 1 -->
    <rect x="100" y="80" width="140" height="320" rx="12" fill="#1F1F1F" stroke="#F5B800" stroke-width="2" stroke-opacity="0.4" />
    <ellipse cx="170" cy="80" rx="70" ry="25" fill="#292929" stroke="#F5B800" stroke-width="2" stroke-opacity="0.6" />
    <!-- Silo 2 (Taller) -->
    <rect x="280" y="40" width="160" height="360" rx="12" fill="#242424" stroke="#F5B800" stroke-width="2.5" />
    <ellipse cx="360" cy="40" rx="80" ry="30" fill="#303030" stroke="url(#gold)" stroke-width="2.5" />
    <!-- Silo 3 -->
    <rect x="480" y="100" width="140" height="300" rx="12" fill="#1D1D1D" stroke="#F5B800" stroke-width="2" stroke-opacity="0.4" />
    <ellipse cx="550" cy="100" rx="70" ry="25" fill="#262626" stroke="#F5B800" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Support Gantry Truss -->
    <path d="M 60 400 H 660 L 600 480 H 120 Z" fill="#151515" stroke="#F5B800" stroke-width="2" stroke-opacity="0.5" />
    <line x1="200" y1="400" x2="200" y2="480" stroke="#F5B800" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="360" y1="400" x2="360" y2="480" stroke="#F5B800" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="520" y1="400" x2="520" y2="480" stroke="#F5B800" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Automated Conveyor Belt Ramp -->
    <line x1="0" y1="480" x2="680" y2="220" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="490" x2="680" y2="230" stroke="#F5B800" stroke-opacity="0.3" stroke-width="2" />
  </g>
  
  <!-- Technical Overlay Badge -->
  <rect x="50" y="50" width="280" height="36" rx="6" fill="rgba(245, 184, 0, 0.12)" stroke="#F5B800" stroke-opacity="0.4" />
  <circle cx="72" cy="68" r="4" fill="#F5B800" />
  <text x="90" y="73" fill="#FFD45A" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">AUTOMATED BATCHING PLANT</text>
</svg>
