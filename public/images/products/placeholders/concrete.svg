<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0E0E0E" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B800" />
      <stop offset="100%" stop-color="#FFD45A" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Industrial Concrete Mixer / Flow Graphic -->
  <g transform="translate(400, 280)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#F5B800" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="12 12" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#yellow)" stroke-opacity="0.5" stroke-width="3" />
    
    <!-- Flowing Industrial Waves -->
    <path d="M -90 -20 Q -40 40 0 -20 T 90 -20" fill="none" stroke="#F5B800" stroke-width="4" />
    <path d="M -90 10 Q -40 70 0 10 T 90 10" fill="none" stroke="#FFD45A" stroke-opacity="0.6" stroke-width="3" />
    <path d="M -90 40 Q -40 100 0 40 T 90 40" fill="none" stroke="#F5B800" stroke-opacity="0.4" stroke-width="2" />
    
    <circle cx="0" cy="0" r="14" fill="#F5B800" />
  </g>
  
  <!-- Badge Label -->
  <rect x="40" y="40" width="200" height="32" rx="6" fill="rgba(245, 184, 0, 0.15)" stroke="#F5B800" stroke-opacity="0.4" />
  <text x="140" y="61" fill="#FFD45A" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle">READY-MIX CONCRETE</text>
</svg>
