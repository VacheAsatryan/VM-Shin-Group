<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#090909" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Curbstone Border Profile Graphic -->
  <g transform="translate(180, 180)">
    <!-- Long Curb Segment 1 -->
    <polygon points="0,120 280,0 380,40 100,160" fill="#2D2D2D" stroke="#F5B800" stroke-width="2.5" />
    <polygon points="100,160 380,40 380,120 100,240" fill="#202020" stroke="#F5B800" stroke-width="2" />
    <polygon points="0,120 100,160 100,240 0,200" fill="#181818" stroke="#F5B800" stroke-width="2" />
    
    <!-- Chamfer Edge Accent -->
    <line x1="280" y1="0" x2="380" y2="40" stroke="#FFD45A" stroke-width="3" />
  </g>
  
  <!-- Badge Label -->
  <rect x="40" y="40" width="150" height="32" rx="6" fill="rgba(245, 184, 0, 0.15)" stroke="#F5B800" stroke-opacity="0.4" />
  <text x="115" y="61" fill="#FFD45A" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle">CURBSTONES</text>
</svg>
