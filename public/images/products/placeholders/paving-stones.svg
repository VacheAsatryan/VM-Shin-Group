<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616" />
      <stop offset="50%" stop-color="#101010" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Interlocking Paving Stones Pattern -->
  <g transform="translate(150, 100)" stroke="#F5B800" stroke-width="2" stroke-opacity="0.5">
    <!-- Row 1 -->
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#252525" />
    <rect x="160" y="0" width="150" height="80" rx="8" fill="#1F1F1F" />
    <rect x="320" y="0" width="150" height="80" rx="8" fill="#252525" />
    
    <!-- Row 2 (Shifted) -->
    <rect x="75" y="90" width="150" height="80" rx="8" fill="#1D1D1D" />
    <rect x="235" y="90" width="150" height="80" rx="8" fill="#242424" />
    <rect x="395" y="90" width="100" height="80" rx="8" fill="#1A1A1A" />
    
    <!-- Row 3 -->
    <rect x="0" y="180" width="150" height="80" rx="8" fill="#222222" />
    <rect x="160" y="180" width="150" height="80" rx="8" fill="#2A2A2A" stroke="#FFD45A" stroke-opacity="0.8" />
    <rect x="320" y="180" width="150" height="80" rx="8" fill="#222222" />
    
    <!-- Row 4 -->
    <rect x="75" y="270" width="150" height="80" rx="8" fill="#1C1C1C" />
    <rect x="235" y="270" width="150" height="80" rx="8" fill="#252525" />
  </g>
  
  <!-- Badge Label -->
  <rect x="40" y="40" width="170" height="32" rx="6" fill="rgba(245, 184, 0, 0.15)" stroke="#F5B800" stroke-opacity="0.4" />
  <text x="125" y="61" fill="#FFD45A" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle">PAVING STONES</text>
</svg>
