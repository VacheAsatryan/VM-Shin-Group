<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#090909" />
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B800" />
      <stop offset="100%" stop-color="#FFD45A" />
    </linearGradient>
    <pattern id="pumice" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="rgba(245, 184, 0, 0.15)" />
      <circle cx="15" cy="12" r="2" fill="rgba(255, 255, 255, 0.08)" />
      <circle cx="10" cy="18" r="1" fill="rgba(245, 184, 0, 0.1)" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <rect width="800" height="600" fill="url(#pumice)" />
  
  <!-- 3D Pumice Block Graphic -->
  <g transform="translate(250, 180)">
    <!-- Top Face -->
    <polygon points="150,0 300,50 150,100 0,50" fill="#2A2A2A" stroke="#F5B800" stroke-width="2" stroke-opacity="0.6" />
    <!-- Left Face -->
    <polygon points="0,50 150,100 150,230 0,180" fill="#1C1C1C" stroke="#F5B800" stroke-width="2" stroke-opacity="0.4" />
    <!-- Right Face -->
    <polygon points="150,100 300,50 300,180 150,230" fill="#151515" stroke="#F5B800" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- Hollow Core 1 -->
    <polygon points="70,45 120,60 90,75 40,60" fill="#0D0D0D" stroke="url(#yellow)" stroke-width="1.5" />
    <!-- Hollow Core 2 -->
    <polygon points="180,60 230,45 200,30 150,45" fill="#0D0D0D" stroke="url(#yellow)" stroke-width="1.5" />
  </g>
  
  <!-- Label -->
  <rect x="40" y="40" width="160" height="32" rx="6" fill="rgba(245, 184, 0, 0.15)" stroke="#F5B800" stroke-opacity="0.4" />
  <text x="120" y="61" fill="#FFD45A" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="2" text-anchor="middle">PEMZABLOK</text>
</svg>
